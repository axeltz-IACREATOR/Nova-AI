<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova IA</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f12;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      border-bottom: 1px solid #29292f;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 85%;
      padding: 12px 15px;
      border-radius: 16px;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    .user {
      align-self: flex-end;
      background: #2f6fed;
    }

    .assistant {
      align-self: flex-start;
      background: #24242b;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #29292f;
    }

    input {
      flex: 1;
      padding: 14px;
      border: none;
      outline: none;
      border-radius: 12px;
      background: #24242b;
      color: white;
      font-size: 16px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 0 18px;
      background: #2f6fed;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
    }
  </style>
</head>

<body>

  <header>🤖 Nova IA</header>

  <div id="chat">
    <div class="message assistant">
      ¡Hola! Soy Nova IA 🤖 ¿En qué puedo ayudarte?
    </div>
  </div>

  <div class="input-area">
    <input
      id="input"
      type="text"
      placeholder="Escribe un mensaje..."
      autocomplete="off"
    >

    <button id="send">Enviar</button>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const send = document.getElementById("send");

    const messages = [];

    function addMessage(text, type) {
      const div = document.createElement("div");
      div.className = "message " + type;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    async function sendMessage() {
      const text = input.value.trim();

      if (!text || send.disabled) return;

      input.value = "";
      send.disabled = true;

      addMessage(text, "user");

      messages.push({
        role: "user",
        content: text
      });

      const loading = addMessage("Nova IA está pensando... 🤔", "assistant");

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            messages: messages
          })
        });

        const data = await response.json();

        loading.remove();

        if (!response.ok) {
          throw new Error(data.error || "Error del servidor");
        }

        addMessage(data.reply, "assistant");

        messages.push({
          role: "assistant",
          content: data.reply
        });

      } catch (error) {
        loading.textContent =
          "❌ Ocurrió un error al conectar con Nova IA.";
        console.error(error);
      }

      send.disabled = false;
      input.focus();
    }

    send.addEventListener("click", sendMessage);

    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });
  </script>

</body>
</html>
